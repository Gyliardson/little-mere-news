name: CI

on:
  push:
    branches:
      - portfolio/revamp-2026
      - 'work/**'
  pull_request:
    branches:
      - portfolio/revamp-2026
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      ADMIN_PHANTOM_PATH: ci-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  harvester:
    name: Harvester deterministic tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend-Harvester
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend-Harvester/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run deterministic tests
        run: pytest -q

  publisher:
    name: Publisher syntax sanity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend-Publisher
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend-Publisher/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
