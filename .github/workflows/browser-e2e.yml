name: Browser E2E

on:
  push:
    branches:
      - 'work/**'
      - portfolio/revamp-2026
  pull_request:
    branches:
      - portfolio/revamp-2026

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      ADMIN_PHANTOM_PATH: ci-admin
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and browser regressions
        shell: bash
        run: |
          set -o pipefail
          node e2e/fake-supabase.mjs > /tmp/fake-supabase.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:54321/rest/v1/news >/dev/null; then
              break
            fi
            sleep 1
          done
          npm run build
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/lmn-next.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/en/ci-admin/login >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error \
            'http://127.0.0.1:3000/_next/image?url=%2Flogo.png&w=48&q=75' \
            -o /tmp/optimized-logo
          printf 'optimizer-bytes=' && wc -c < /tmp/optimized-logo
          file /tmp/optimized-logo
          mkdir -p test-results
          npm run test:e2e 2>&1 | tee /tmp/browser-tests.log
      - name: Upload temporary media evidence
        if: success() && github.ref_name == 'work/21-media-performance'
        uses: actions/upload-artifact@v4
        with:
          name: media-performance-evidence-${{ github.sha }}
          path: |
            frontend-web/test-results/media-desktop.png
            frontend-web/test-results/media-mobile.png
          if-no-files-found: error
          retention-days: 7
      - name: Capture browser failure evidence
        if: failure()
        run: |
          mkdir -p test-results
          cp /tmp/lmn-next.log test-results/next.log 2>/dev/null || true
          cp /tmp/fake-supabase.log test-results/fake-supabase.log 2>/dev/null || true
          cp /tmp/browser-tests.log test-results/browser-tests.log 2>/dev/null || true
          cp public/logo.png test-results/source-logo.png 2>/dev/null || true
          npx playwright screenshot http://127.0.0.1:3000/en/ci-admin/login test-results/failure.png || true
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failure-${{ github.sha }}
          path: frontend-web/test-results
          if-no-files-found: warn
          retention-days: 7
